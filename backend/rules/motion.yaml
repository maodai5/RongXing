# 萌宠动图（FRD F14）：动作集、健康与手势映射、生成规格。版本化下发，改配置不改客户端。
# 规格硬约束：单条 GIF ≤7s、高 480、12fps、循环；服务端逐条校验，超限记该动作失败。
version: mo-2026-11-21
max_seconds: 7
fps: 12
height: 480
min_ready: 8
standby: idle
style_prompt: 将这张猫咪照片转为萌系卡通形象，保留毛色、花纹与体态特征，圆眼短腿、纯色浅底、正面全身。
# 首帧一致性约束与全局负向词：与 wan-video-studio、providers/motion_prompts.py 同一套措辞。
identity_prompt: '以上传图为首帧，保持同一只宠物的物种、毛色、花纹、眼睛颜色及耳形。整体为卡通 2.5D 画风：圆润简化的形体、干净平涂与 2 层柔和分层阴影、成组蓬松绒毛块（不出现写实毛发丝），背景保持纯色 #FEECD4。保持首帧的构图、背景和主体位置，固定机位，不重构画外部位。开头短暂停住，中间只做一次小动作，结尾自然停稳。'
negative_prompt: '换宠物，毛色或花纹漂移，五官变形，四肢增生，夸张拟人表情，写实毛发，塑料质感，粗黑描边，硬光，背景跳变，镜头移动或变焦，切镜头，画面闪烁。'
# 分身立绘（图生图）提示词：全身完整入画，纯色奶油底。
portrait:
  reference: '以上传图同一只宠物为原型，保留它的物种、毛色、花纹、耳形、眼睛颜色与体型比例，重绘成一张完整的全身角色立绘：从头顶、耳朵到最后一只脚掌和尾巴尖，全部完整落在画面内，任何部位都不被画框裁切；参考图若只拍到半身或局部，请按同一只宠物的毛色与体型合理补全后腿、脚掌和尾巴，不要沿用参考图的裁切构图。'
  body: '画风：卡通 2.5D，带明显 3D 动画电影质感 —— 圆润立体的形体有清晰体积感与厚度，柔和的全局光照，暗部带轻微环境光遮蔽，边缘一道细软的轮廓光让主体从背景中浮出来；头略大、眼睛大而圆、口鼻小巧、四肢短圆；毛发概括成几组清晰的蓬松绒毛块，末端少量短毛尖，不画单根写实毛发丝；整体像高品质 3D 动画电影的角色设定渲染：材质干净、略带哑光绒感，保持卡通比例与简化细节；不要写实摄影感、不要毛绒玩偶实拍感、不要纯 2D 平涂插画。构图：正方形 1:1，全身完整入画，头顶、耳朵、四只脚掌与尾尖全部可见且不贴边；宠物为纵向站姿或坐姿（四脚着地、身体朝上延伸），不要横向趴卧、不要压扁身体；主体居中，高度约占画面 72%，四周留白均衡（上下各约 12%、左右各约 14%）；平视四分之三侧身，安静看向镜头，姿态自然放松。背景：纯色 #FEECD4（RGB 254, 236, 212），是明亮偏浅的奶油底色，比常见米色更亮更淡；完全平涂，无渐变、无暗角、无光斑、无地面线、无道具、无文字；主体脚下只留极淡的柔和接触阴影。光色：左上方柔和漫射主光，暖调浅阴影，整体明亮干净，主色不超过 4 种。'
  negative: '写实毛发，写实渲染，纯 2D 平涂，扁平贴纸感，无体积感，线稿风，毛绒玩偶摄影感，单根毛发丝，渐变背景，背景偏暗，暗角，复杂背景，地面反光，道具，文字，水印，多肢，断肢，尾巴或脚被裁切，横向趴卧，身体被压扁，半身像，胸部以上特写，只画头部和前胸，沿用参考图的裁切构图，四肢出框，尾巴出框，主体贴边，五官畸形，粗黑描边，硬光，镜头畸变，鱼眼，过曝。'
  render_size: '1024*1024'
  size: 480
actions: [idle, happy, play, stretch, yawn, groom, sleep, alert, sad, sick, look_left, look_right]
prompts:
  idle: idle 待机：保持原姿势和视线，若首帧睁眼只缓慢眨眼一次、若本来闭眼只表现轻微呼吸；首尾帧对齐可无缝循环
  happy: happy 开心：轻快将下巴抬高一点，像看到熟悉的人，嘴巴自然闭合、身体不移动，尾巴可小幅摆动
  play: play 玩耍：前爪扑动，追着自己的尾巴转半圈
  stretch: stretch 伸懒腰：前身压低、后身抬高，拉长身体再回正
  yawn: yawn 打哈欠：张大嘴，闭眼仰头，缓慢回正
  groom: groom 洗脸：低头，前爪贴近脸侧擦拭
  sleep: sleep 睡觉：趴卧闭眼，呼吸慢而深
  alert: alert 警觉：耳朵竖起，抬头张望，身体绷紧
  sad: sad 低落：只将目光慢慢垂向前方地面，头部和身体保持原位，不流泪
  sick: sick 不适：眼睑缓缓垂下一点，像安静休息，保持姿势，不表现伤口、喘气或抽搐；半闭眼趴卧少动
  look_left: look_left 左看：目光与头部一起轻转向画面左侧（观众的左手边），幅度很小，身体不转动
  look_right: look_right 右看：目光与头部一起轻转向画面右侧（观众的右手边），幅度很小，身体不转动
health:
  normal: idle
  observe: alert
  vet: sick
  urgent: sick
gestures:
  tap:
    actions: [happy, play]
    replies: [蹭了蹭你的手，尾巴翘起来了。, 扑了个空，又假装什么都没发生。]
  long_press:
    actions: [groom, stretch, yawn]
    replies: [被摸得很舒服，开始认真洗脸。, 伸了个长长的懒腰。, 打了个哈欠，眼睛都眯起来了。]
  swipe_left:
    actions: [look_left]
    replies: [扭头看向左边。]
  swipe_right:
    actions: [look_right]
    replies: [扭头看向右边。]
emotions:
  happy: happy
  relaxed: idle
  annoyed: alert
  fearful: sad
  painful: sick
  seeking_attention: [look_left, look_right]
labels:
  idle: 待机
  happy: 开心
  play: 玩耍
  stretch: 伸懒腰
  yawn: 打哈欠
  groom: 洗脸
  sleep: 睡觉
  alert: 警觉
  sad: 难过
  sick: 不适
  look_left: 向左看
  look_right: 向右看
status_labels:
  normal: 精神不错
  observe: 在观察
  vet: 建议就医
  urgent: 建议立即就医
